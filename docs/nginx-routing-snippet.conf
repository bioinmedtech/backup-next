# Include this inside the relevant server { ... } block for bioinmed.ru
# Root should point to the project directory, for example:
# root /var/www/bioinmed-next;
# index index.php;

error_page 404 /404.php;

location / {
    try_files $uri $uri/ @bioinmed_routes;
}

location @bioinmed_routes {
    rewrite ^/about/?$ /about.php last;
    rewrite ^/license/?$ /license.php last;
    rewrite ^/sterility/?$ /sterility.php last;
    rewrite ^/vacancies/?$ /vacancies.php last;
    rewrite ^/prices/?$ /prices.php last;
    rewrite ^/privacy/?$ /privacy.php last;
    rewrite ^/user-agreement/?$ /user-agreement.php last;
    rewrite ^/services/?$ /services.php last;
    rewrite ^/doctors/?$ /doctors.php last;
    rewrite ^/blog/?$ /blog.php last;
    rewrite ^/blog/post/([0-9]+-[^/]+)/?$ /blog/post.php?slug=$1 last;
    rewrite ^/blog/post/?$ /blog/post.php last;
    rewrite ^/blog/rss\.xml/?$ /blog-rss.php last;
    rewrite ^/problems/?$ /problems.php last;
    rewrite ^/services/([^/]+)/?$ /service.php?slug=$1 last;
    rewrite ^/doctors/([^/]+)/?$ /doctor.php?slug=$1 last;
    rewrite ^/problems/([^/]+)/?$ /problem.php?slug=$1 last;
    rewrite ^/seasons/([^/]+)/?$ /season.php?slug=$1 last;
    return 404;
}

location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

# Optional: deny access to internal project folders.
location ^~ /docs/ { return 403; }
location ^~ /database/ { return 403; }
location ^~ /config/ { return 403; }
